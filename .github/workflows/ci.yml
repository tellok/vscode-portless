name: CI

on:
  push:
    branches:
    - master
    - main
  pull_request:

jobs:
  ci:
    runs-on:
    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Build
      run: pnpm run package
